<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" role="img" aria-label="The three metalevels: the JjOM constructs at M3, the metamodel classifiers at M2 that are instances of DClass, and the model elements at M1 that are instances of those classifiers.">
  <style>
    .t   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .lvl { font-size: 15px; font-weight: 700; fill: #1e293b; }
    .rol { font-size: 12px; fill: #64748b; }
    .box { font-size: 13px; fill: #1e293b; }
    .rel { font-size: 11px; fill: #64748b; font-style: italic; }
    .cnf { font-size: 12px; fill: #0369a1; font-style: italic; }
    .fix { font-size: 11px; fill: #94a3b8; }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9"/>
    </marker>
    <marker id="tipg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="720" height="392" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="719" height="391" fill="none" stroke="#e2e8f0"/>

  <!-- M3 -->
  <rect x="24" y="24" width="672" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="t lvl" x="44" y="50">M3</text>
  <text class="t rol" x="44" y="69">meta-metamodel</text>
  <text class="t rol" x="44" y="86">JjOM</text>
  <text class="t fix" x="44" y="101">fixed</text>

  <rect x="198" y="46" width="118" height="38" rx="8" fill="#ffffff" stroke="#0ea5e9"/>
  <text class="t box" x="257" y="70" text-anchor="middle">DClass</text>
  <rect x="336" y="46" width="118" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="t box" x="395" y="70" text-anchor="middle">DAttribute</text>
  <rect x="474" y="46" width="118" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="t box" x="533" y="70" text-anchor="middle">DReference</text>

  <!-- instance of: DClass -> ogni classificatore M2 -->
  <path d="M 257 84 L 257 168" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#tipg)"/>
  <path d="M 257 84 C 257 130, 395 122, 395 168" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#tipg)"/>
  <path d="M 257 84 C 257 138, 533 118, 533 168" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#tipg)"/>
  <text class="t rel" x="248" y="132" text-anchor="end">instance of</text>

  <!-- M2 -->
  <rect x="24" y="168" width="672" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="t lvl" x="44" y="194">M2</text>
  <text class="t rol" x="44" y="213">metamodel</text>
  <text class="t rol" x="44" y="230">you build this</text>

  <rect x="198" y="190" width="118" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="t box" x="257" y="214" text-anchor="middle">State</text>
  <rect x="336" y="190" width="118" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="t box" x="395" y="214" text-anchor="middle">Transition</text>
  <rect x="474" y="190" width="118" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="t box" x="533" y="214" text-anchor="middle">Event</text>

  <!-- instance of: classificatori -> elementi M1 -->
  <path d="M 257 228 L 257 312" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#tipg)"/>
  <path d="M 395 228 L 395 312" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#tipg)"/>
  <path d="M 533 228 L 533 312" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#tipg)"/>

  <!-- M1 -->
  <rect x="24" y="312" width="672" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="t lvl" x="44" y="338">M1</text>
  <text class="t rol" x="44" y="356">model</text>

  <rect x="198" y="322" width="118" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="t box" x="257" y="346" text-anchor="middle">Idle</text>
  <rect x="336" y="322" width="118" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="t box" x="395" y="346" text-anchor="middle">Idle → Cooking</text>
  <rect x="474" y="322" width="118" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="t box" x="533" y="346" text-anchor="middle">startPressed</text>

  <!-- conforms to, a livello -->
  <path d="M 662 168 L 662 108" fill="none" stroke="#0ea5e9" stroke-width="1.6" marker-end="url(#tip)"/>
  <path d="M 662 312 L 662 252" fill="none" stroke="#0ea5e9" stroke-width="1.6" marker-end="url(#tip)"/>
  <text class="t cnf" x="650" y="142" text-anchor="end">conforms to</text>
  <text class="t cnf" x="650" y="286" text-anchor="end">conforms to</text>
</svg>
