<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="A project holds viewpoints, each view points to its viewpoint, and a view that matches an element produces a node on the canvas.">
  <style>
    .t   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .ttl { font-size: 13px; font-weight: 600; fill: #1e293b; }
    .sub { font-size: 10.5px; fill: #64748b; }
    .rel { font-size: 10.5px; fill: #0369a1; font-style: italic; }
    .cap { font-size: 11px; fill: #64748b; font-style: italic; }
    .tag { font-size: 10px; fill: #0369a1; }
  </style>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="719" height="399" fill="none" stroke="#e2e8f0"/>

  <!-- project -->
  <rect x="24" y="28" width="150" height="46" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="t ttl" x="99" y="48" text-anchor="middle">Project</text>
  <text class="t sub" x="99" y="64" text-anchor="middle">holds the viewpoints</text>

  <!-- viewpoints -->
  <rect x="232" y="20" width="212" height="62" rx="9" fill="#ffffff" stroke="#0ea5e9"/>
  <text class="t ttl" x="248" y="42">Viewpoint</text>
  <text class="t tag" x="428" y="42" text-anchor="end">type: syntax</text>
  <text class="t sub" x="248" y="60">exclusive, one active at a time</text>
  <text class="t sub" x="248" y="74">a DViewElement, its own viewpoint</text>

  <rect x="232" y="96" width="212" height="44" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="t ttl" x="248" y="116">Viewpoint</text>
  <text class="t tag" x="428" y="116" text-anchor="end">type: validation</text>
  <text class="t sub" x="248" y="132">an overlay, any number active</text>

  <path d="M 178 51 L 228 51" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#c)"/>
  <path d="M 178 60 C 205 60, 205 118, 228 118" fill="none" stroke="#0ea5e9" stroke-width="1.3" marker-end="url(#c)"/>

  <!-- views -->
  <rect x="232" y="176" width="212" height="90" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="t ttl" x="248" y="198">View</text>
  <text class="t sub" x="248" y="216">predicate: jsCondition, oclCondition</text>
  <text class="t sub" x="248" y="232">kind: vertex, edge, row</text>
  <text class="t sub" x="248" y="248">structure: ir, or a JSX template</text>
  <text class="t sub" x="248" y="262">events: ECA rules and actions</text>

  <path d="M 338 172 L 338 146" fill="none" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#c)"/>
  <text class="t rel" x="346" y="162">viewpoint</text>

  <!-- model element -->
  <rect x="24" y="196" width="150" height="50" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="t ttl" x="99" y="218" text-anchor="middle">Model element</text>
  <text class="t sub" x="99" y="234" text-anchor="middle">a DObject</text>

  <path d="M 178 221 L 228 221" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text class="t sub" x="203" y="212" text-anchor="middle">matched by</text>

  <!-- node -->
  <rect x="504" y="176" width="192" height="90" rx="9" fill="#ffffff" stroke="#0ea5e9"/>
  <text class="t ttl" x="520" y="198">Node</text>
  <text class="t sub" x="520" y="216">one per matched element</text>
  <text class="t sub" x="520" y="232">x, y, w, h</text>
  <text class="t sub" x="520" y="248">state, written by the rules</text>

  <path d="M 448 221 L 500 221" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#c)"/>
  <text class="t rel" x="474" y="212" text-anchor="middle">renders</text>

  <text class="t cap" x="360" y="320" text-anchor="middle">A viewpoint is a view element that points to itself. A view names the viewpoint it belongs to,</text>
  <text class="t cap" x="360" y="340" text-anchor="middle">so the grouping runs upward, from the views to the viewpoint, not the other way round.</text>
  <text class="t cap" x="360" y="368" text-anchor="middle">No metamodel owns a viewpoint: viewpoints belong to the project and are matched against elements.</text>
</svg>
