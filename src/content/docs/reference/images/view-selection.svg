<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404" role="img" aria-label="How a view is picked for an element: metaclasses, then the form-based predicate, then the kind, and finally the priority.">
  <style>
    .t   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #0369a1; }
    .ttl { font-size: 12.5px; font-weight: 600; fill: #1e293b; }
    .sub { font-size: 11px; fill: #64748b; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <rect width="720" height="404" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="719" height="403" fill="none" stroke="#e2e8f0"/>

  <rect x="24" y="26" width="180" height="44" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="t ttl" x="114" y="45" text-anchor="middle">An element to draw</text>
  <text class="t sub" x="114" y="61" text-anchor="middle">and the views of the viewpoint</text>
  <path d="M 114 74 L 114 96" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#c)"/>

  <rect x="24" y="100" width="672" height="52" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="48" cy="126" r="11" fill="#0ea5e9"/>
  <text class="t num" x="48" y="130" text-anchor="middle">1</text>
  <text class="t ttl" x="70" y="122">Metaclasses</text>
  <text class="t sub" x="70" y="140">the classes the view accepts, or the wildcard<tspan class="t m">   ir.metaclasses</tspan></text>

  <rect x="24" y="164" width="672" height="52" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="48" cy="190" r="11" fill="#0ea5e9"/>
  <text class="t num" x="48" y="194" text-anchor="middle">2</text>
  <text class="t ttl" x="70" y="186">Predicate</text>
  <text class="t sub" x="70" y="204">built in the form: and, or, not, comparisons, exists<tspan class="t m">   ir.predicate</tspan></text>

  <rect x="24" y="228" width="672" height="52" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="48" cy="254" r="11" fill="#0ea5e9"/>
  <text class="t num" x="48" y="258" text-anchor="middle">3</text>
  <text class="t ttl" x="70" y="250">Kind</text>
  <text class="t sub" x="70" y="268">a vertex view never draws an edge<tspan class="t m">   ir.kind, which also writes appliableTo</tspan></text>

  <path d="M 360 284 L 360 302" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#c)"/>

  <rect x="150" y="306" width="420" height="46" rx="9" fill="#ffffff" stroke="#0ea5e9"/>
  <text class="t ttl" x="360" y="326" text-anchor="middle">The highest priority wins and renders</text>
  <text class="t sub" x="360" y="343" text-anchor="middle"><tspan class="t m">ir.priority</tspan> settles what is left, the wildcard ranks lowest</text>

  <text class="t sub" x="360" y="380" text-anchor="middle">Predicates are built in the Applies to form. OCL selection was dropped in 3.0.</text>
</svg>
